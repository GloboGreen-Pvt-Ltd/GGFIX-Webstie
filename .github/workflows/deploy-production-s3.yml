name: Deploy Admin to Production S3

# Dedicated Production deploy — kept separate from Development and Preview so a
# push to `main` (i.e. a merged preview -> main PR) can only ever touch the
# Production S3 bucket + CloudFront distribution, never Development or Preview.
#
# Structure mirrors deploy-development-s3.yml (build path, AWS auth switch, S3
# sync/cache-header split, directory-key alias workaround); only the trigger and
# the config source are narrowed down to the `production` environment. Put a
# required reviewer on the `production` environment so nothing auto-ships from
# `main` without a human in the loop.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  # Only needed for the OIDC credential path; harmless when access keys are used.
  id-token: write

concurrency:
  group: s3-deploy-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      BUCKET: ${{ vars.S3_BUCKET_PRODUCTION }}
      DISTRIBUTION: ${{ vars.CLOUDFRONT_DISTRIBUTION_PRODUCTION }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Fail fast and loudly. output:'export' bakes NEXT_PUBLIC_* in at BUILD
      # time, so an unset variable does NOT error — api.js silently falls back to
      # http://localhost:* and we would sync a dead bundle over a working site.
      - name: Verify configuration
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          NEXT_PUBLIC_MASTER_DATA_BASE: ${{ vars.NEXT_PUBLIC_MASTER_DATA_BASE }}
          NEXT_PUBLIC_AUTH_BASE: ${{ vars.NEXT_PUBLIC_AUTH_BASE }}
          HAS_ROLE: ${{ vars.AWS_ROLE_TO_ASSUME != '' }}
          HAS_KEYS: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}
        run: |
          missing=""
          for v in BUCKET AWS_REGION NEXT_PUBLIC_MASTER_DATA_BASE NEXT_PUBLIC_AUTH_BASE; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing configuration for 'production':$missing"
            exit 1
          fi
          if [ "$HAS_ROLE" != "true" ] && [ "$HAS_KEYS" != "true" ]; then
            echo "::error::No AWS credentials. Set the AWS_ROLE_TO_ASSUME variable (OIDC, preferred),"
            echo "or the AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY secrets, in the 'production' environment."
            exit 1
          fi
          # The bucket is private (Block Public Access on) and served through
          # CloudFront, so a sync without an invalidation leaves the old build live.
          if [ -z "$DISTRIBUTION" ]; then
            echo "::warning::CLOUDFRONT_DISTRIBUTION_PRODUCTION is not set —"
            echo "::warning::skipping cache invalidation. CloudFront may keep serving the previous build."
          fi
          echo "Config OK — bucket '$BUCKET' in $AWS_REGION."

      - run: npm ci

      - name: Build static export
        env:
          NEXT_PUBLIC_MASTER_DATA_BASE: ${{ vars.NEXT_PUBLIC_MASTER_DATA_BASE }}
          NEXT_PUBLIC_API_BASE: ${{ vars.NEXT_PUBLIC_API_BASE }}
          NEXT_PUBLIC_AUTH_BASE: ${{ vars.NEXT_PUBLIC_AUTH_BASE }}
          NEXT_PUBLIC_TICKET_BASE: ${{ vars.NEXT_PUBLIC_TICKET_BASE }}
          NEXT_PUBLIC_USER_BASE: ${{ vars.NEXT_PUBLIC_USER_BASE }}
          NEXT_PUBLIC_SHOP_BASE: ${{ vars.NEXT_PUBLIC_SHOP_BASE }}
          NEXT_PUBLIC_TECHNICIAN_BASE: ${{ vars.NEXT_PUBLIC_TECHNICIAN_BASE }}
          NEXT_PUBLIC_INVENTORY_BASE: ${{ vars.NEXT_PUBLIC_INVENTORY_BASE }}
          NEXT_PUBLIC_MARKETPLACE_BASE: ${{ vars.NEXT_PUBLIC_MARKETPLACE_BASE }}
          NEXT_PUBLIC_PICKUP_BASE: ${{ vars.NEXT_PUBLIC_PICKUP_BASE }}
          NEXT_PUBLIC_NOTIFICATION_BASE: ${{ vars.NEXT_PUBLIC_NOTIFICATION_BASE }}
          NEXT_PUBLIC_SUBSCRIPTION_BASE: ${{ vars.NEXT_PUBLIC_SUBSCRIPTION_BASE }}
          NEXT_PUBLIC_ORDER_BASE: ${{ vars.NEXT_PUBLIC_ORDER_BASE }}
        run: npm run build

      # OIDC when a role is configured, long-lived keys otherwise. The `secrets`
      # context is not allowed in a step `if:`, so the switch reads the variable.
      - name: Configure AWS credentials (OIDC)
        if: vars.AWS_ROLE_TO_ASSUME != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Configure AWS credentials (access keys)
        if: vars.AWS_ROLE_TO_ASSUME == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # Long-cache the fingerprinted assets, never cache the HTML. Without this the
      # CDN can hand out a stale index.html that points at deleted _next chunks.
      - name: Sync to S3
        run: |
          aws s3 sync out/ "s3://$BUCKET" --delete \
            --exclude "*.html" --exclude "*.json" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 sync out/ "s3://$BUCKET" --delete \
            --exclude "*" --include "*.html" --include "*.json" \
            --cache-control "public,max-age=0,must-revalidate"

      # INTERIM until the CloudFront rewrite function is attached to this
      # distribution (see infra/apply-cloudfront-rewrite.sh). CloudFront passes the
      # URI straight through as the S3 key, so a directory URL like /management/
      # asks for the key "management/" — which the export never writes, since it
      # produces management/index.html. On an OAC'd REST origin that miss comes
      # back as a bare 403, so every route except "/" would be dead without this.
      - name: Publish directory-key aliases
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r page; do
            dir="${page#out/}"          # management/brands/index.html
            dir="${dir%index.html}"     # management/brands/
            [ -n "$dir" ] || continue
            for key in "$dir" "${dir%/}"; do
              aws s3api put-object \
                --bucket "$BUCKET" \
                --key "$key" \
                --body "$page" \
                --content-type "text/html" \
                --cache-control "public,max-age=0,must-revalidate" >/dev/null
              count=$((count + 1))
            done
          done < <(find out -name index.html)
          echo "published $count directory-key aliases (both /path/ and /path)"

      # Must not fail the job: the S3 sync above already succeeded, so the new
      # build is live. A missing cloudfront:CreateInvalidation permission for this
      # distribution would otherwise turn a cache-staleness issue into a full
      # deploy failure.
      - name: Invalidate CloudFront
        if: env.DISTRIBUTION != ''
        run: |
          if ! aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION" --paths "/*"; then
            echo "::warning::CloudFront invalidation failed (often a missing cloudfront:CreateInvalidation permission for distribution $DISTRIBUTION). S3 is already updated — CloudFront may keep serving cached assets until they expire or invalidation is retried with the right permissions."
          fi

      - name: Summary
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Environment | \`production\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Bucket | \`$BUCKET\` |"
            echo "| Distribution | \`${DISTRIBUTION:-not set}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
