name: Apply CloudFront rewrite

# One-shot infrastructure fix, deliberately NOT part of the deploy.
#
# The S3 buckets are REST origins behind OAC, so CloudFront never maps /management/
# to the exported management/index.html — every route except "/" answers 403. This
# attaches infra/cloudfront-rewrite-index.js as a viewer-request function and points
# 403/404 at /404.html. See infra/apply-cloudfront-rewrite.sh for the full why.
#
# It runs here rather than from a laptop because the deploy credentials already
# reach the frontend AWS account (they sync S3 and invalidate CloudFront), which is a
# different account from the one hosting api.ggfix.in.
#
# Defaults to `plan`, which only reads. Choose `apply` to actually change the
# distribution. Applying is idempotent, so a repeat run is a no-op.

on:
  workflow_dispatch:
    inputs:
      distributions:
        description: Distribution IDs, space-separated
        type: string
        default: E1E6CMW5CEO8Z5
      mode:
        description: plan reads only; apply changes the distribution
        type: choice
        options: [plan, apply]
        default: plan
  # workflow_dispatch only works once the file is on the DEFAULT branch, and main is
  # still an empty initial commit — putting it there means shipping the whole app to
  # production, which is a separate decision. Pushing this branch runs the read-only
  # plan in the meantime; deploy-s3.yml ignores it, so nothing deploys.
  # A push can carry no inputs, so it always plans and never applies.
  push:
    branches: [ci/cloudfront-plan]

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudfront-rewrite
  cancel-in-progress: false

jobs:
  rewrite:
    runs-on: ubuntu-latest
    env:
      # A push event carries no inputs, so both fall back to the safe defaults.
      DISTRIBUTIONS: ${{ inputs.distributions || 'E1E6CMW5CEO8Z5' }}
      MODE: ${{ inputs.mode || 'plan' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        if: vars.AWS_ROLE_TO_ASSUME != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Configure AWS credentials (access keys)
        if: vars.AWS_ROLE_TO_ASSUME == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # Missing CloudFront permissions are the likely failure here — the deploy user
      # only had to invalidate until now. Surface that as a readable error instead of
      # a raw AccessDenied halfway through the script.
      - name: Check permissions
        run: |
          set -e
          echo "identity: $(aws sts get-caller-identity --query Arn --output text)"
          for dist in $DISTRIBUTIONS; do
            if aws cloudfront get-distribution-config --region us-east-1 --id "$dist" >/dev/null 2>&1; then
              echo "  $dist: readable"
            else
              echo "::error::Cannot read distribution $dist. The deploy credentials"
              echo "::error::need cloudfront:GetDistributionConfig (and UpdateDistribution,"
              echo "::error::CreateFunction, PublishFunction to apply). Grant those or run"
              echo "::error::infra/apply-cloudfront-rewrite.sh locally with frontend-account creds."
              exit 1
            fi
          done

      - name: Run
        run: |
          chmod +x infra/apply-cloudfront-rewrite.sh
          if [ "$MODE" = "apply" ]; then
            infra/apply-cloudfront-rewrite.sh $DISTRIBUTIONS --apply
          else
            infra/apply-cloudfront-rewrite.sh $DISTRIBUTIONS
          fi

      - name: Verify
        if: env.MODE == 'apply'
        run: |
          echo "CloudFront takes ~5 min to redeploy; these may still show the old status."
          for p in / /management/ /nope-xyz/; do
            printf '%-16s %s\n' "$p" "$(curl -s -o /dev/null -w '%{http_code}' "https://preview.ggfix.in$p")"
          done
          {
            echo "### Expected once deployed"
            echo "| Path | Expect |"
            echo "|---|---|"
            echo "| \`/\` | 200 |"
            echo "| \`/management/\` | 200 |"
            echo "| \`/nope-xyz/\` | 404 |"
          } >> "$GITHUB_STEP_SUMMARY"
