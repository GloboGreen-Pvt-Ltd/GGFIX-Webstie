name: Deploy Admin to S3

# Three-branch promotion flow — one branch per environment:
#   Preview      -> preview     (test)        -> S3_BUCKET_PREVIEW
#   Development  -> development (deploy-test) -> S3_BUCKET_DEVELOPMENT
#   main         -> production  (LIVE)        -> S3_BUCKET_PRODUCTION
#
# The bucket is picked by *name* from the repo-level variables above — the branch
# resolves to PREVIEW / DEVELOPMENT / PRODUCTION and that suffix indexes into the
# vars context. The NEXT_PUBLIC_* bases and AWS_REGION are shared repo variables,
# since every environment talks to the same api.ggfix.in backend.
#
# The job still declares a GitHub Environment of the matching name. Nothing has to
# be defined there — environment variables simply override the repo-level ones when
# an environment does set them — but it gives you the place to add a required
# reviewer on "production" so nothing auto-ships from main.

on:
  push:
    branches: [main, Development, Preview]
  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy
        type: choice
        options: [preview, development, production]
        default: preview

# id-token is only needed for the OIDC path; harmless when using access keys.
permissions:
  contents: read
  id-token: write

# Per-branch, so a Preview deploy never cancels a production deploy.
concurrency:
  group: s3-deploy-${{ github.event.inputs.target || github.ref_name }}
  cancel-in-progress: true

jobs:
  # Branch -> environment. Emits both the lowercase name (for `environment:`) and
  # the uppercase suffix used to index S3_BUCKET_* / CLOUDFRONT_DISTRIBUTION_*.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.pick.outputs.env_name }}
      env_upper: ${{ steps.pick.outputs.env_upper }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            name="${{ github.event.inputs.target }}"
          else
            case "${{ github.ref_name }}" in
              main)        name=production  ;;
              Development) name=development ;;
              Preview)     name=preview     ;;
              *) echo "::error::Branch '${{ github.ref_name }}' is not wired to an environment."; exit 1 ;;
            esac
          fi
          echo "env_name=$name" >> "$GITHUB_OUTPUT"
          echo "env_upper=$(echo "$name" | tr '[:lower:]' '[:upper:]')" >> "$GITHUB_OUTPUT"
          echo "Deploying **$name** from \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"

  build-and-deploy:
    needs: resolve
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.env_name }}
    env:
      # Indexing the vars context by a computed name is how one workflow serves
      # three buckets without duplicating the job per environment.
      BUCKET: ${{ vars[format('S3_BUCKET_{0}', needs.resolve.outputs.env_upper)] }}
      DISTRIBUTION: ${{ vars[format('CLOUDFRONT_DISTRIBUTION_{0}', needs.resolve.outputs.env_upper)] }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Fail fast and loudly. output:'export' bakes NEXT_PUBLIC_* in at BUILD
      # time, so an unset variable does NOT error — api.js silently falls back to
      # http://localhost:* and we would sync a dead bundle over a working site.
      - name: Verify configuration
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          NEXT_PUBLIC_MASTER_DATA_BASE: ${{ vars.NEXT_PUBLIC_MASTER_DATA_BASE }}
          NEXT_PUBLIC_AUTH_BASE: ${{ vars.NEXT_PUBLIC_AUTH_BASE }}
          HAS_ROLE: ${{ vars.AWS_ROLE_TO_ASSUME != '' }}
          HAS_KEYS: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}
        run: |
          missing=""
          for v in BUCKET AWS_REGION NEXT_PUBLIC_MASTER_DATA_BASE NEXT_PUBLIC_AUTH_BASE; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -z "$BUCKET" ]; then
            echo "::error::S3_BUCKET_${{ needs.resolve.outputs.env_upper }} is not set."
          fi
          if [ -n "$missing" ]; then
            echo "::error::Missing configuration for '${{ needs.resolve.outputs.env_name }}':$missing"
            exit 1
          fi
          if [ "$HAS_ROLE" != "true" ] && [ "$HAS_KEYS" != "true" ]; then
            echo "::error::No AWS credentials. Set the AWS_ROLE_TO_ASSUME variable (OIDC, preferred),"
            echo "or the AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY secrets."
            exit 1
          fi
          # The buckets are private (Block Public Access on) and served through
          # CloudFront, so a sync without an invalidation leaves the old build live.
          if [ -z "$DISTRIBUTION" ]; then
            echo "::warning::CLOUDFRONT_DISTRIBUTION_${{ needs.resolve.outputs.env_upper }} is not set —"
            echo "::warning::skipping cache invalidation. CloudFront may keep serving the previous build."
          fi
          echo "Config OK — bucket '$BUCKET' in $AWS_REGION."

      - run: npm ci

      - name: Build static export
        env:
          NEXT_PUBLIC_MASTER_DATA_BASE: ${{ vars.NEXT_PUBLIC_MASTER_DATA_BASE }}
          NEXT_PUBLIC_API_BASE: ${{ vars.NEXT_PUBLIC_API_BASE }}
          NEXT_PUBLIC_AUTH_BASE: ${{ vars.NEXT_PUBLIC_AUTH_BASE }}
          NEXT_PUBLIC_TICKET_BASE: ${{ vars.NEXT_PUBLIC_TICKET_BASE }}
          NEXT_PUBLIC_USER_BASE: ${{ vars.NEXT_PUBLIC_USER_BASE }}
          NEXT_PUBLIC_SHOP_BASE: ${{ vars.NEXT_PUBLIC_SHOP_BASE }}
          NEXT_PUBLIC_TECHNICIAN_BASE: ${{ vars.NEXT_PUBLIC_TECHNICIAN_BASE }}
          NEXT_PUBLIC_INVENTORY_BASE: ${{ vars.NEXT_PUBLIC_INVENTORY_BASE }}
          NEXT_PUBLIC_MARKETPLACE_BASE: ${{ vars.NEXT_PUBLIC_MARKETPLACE_BASE }}
          NEXT_PUBLIC_PICKUP_BASE: ${{ vars.NEXT_PUBLIC_PICKUP_BASE }}
          NEXT_PUBLIC_NOTIFICATION_BASE: ${{ vars.NEXT_PUBLIC_NOTIFICATION_BASE }}
          NEXT_PUBLIC_SUBSCRIPTION_BASE: ${{ vars.NEXT_PUBLIC_SUBSCRIPTION_BASE }}
          NEXT_PUBLIC_ORDER_BASE: ${{ vars.NEXT_PUBLIC_ORDER_BASE }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
        run: npm run build

      # OIDC when a role is configured, long-lived keys otherwise. The `secrets`
      # context is not allowed in a step `if:`, so the switch reads the variable.
      - name: Configure AWS credentials (OIDC)
        if: vars.AWS_ROLE_TO_ASSUME != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Configure AWS credentials (access keys)
        if: vars.AWS_ROLE_TO_ASSUME == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # Long-cache the fingerprinted assets, never cache the HTML. Without this the
      # CDN can hand out a stale index.html that points at deleted _next chunks.
      - name: Sync to S3
        run: |
          aws s3 sync out/ "s3://$BUCKET" --delete \
            --exclude "*.html" --exclude "*.json" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 sync out/ "s3://$BUCKET" --delete \
            --exclude "*" --include "*.html" --include "*.json" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront
        if: env.DISTRIBUTION != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION" --paths "/*"

      - name: Summary
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Environment | \`${{ needs.resolve.outputs.env_name }}\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Bucket | \`$BUCKET\` |"
            echo "| Distribution | \`${DISTRIBUTION:-not set}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
